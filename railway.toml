# Railway deployment config for the openllmrank worker.
#
# Repo-root file. Railway respects this at the project level. The worker
# is the ONLY service we deploy to Railway — the Next.js webapp goes to
# Vercel separately.
#
# Build: Docker. The Dockerfile uses `oven/bun:1.3.13-slim` directly so
# the runtime matches local dev exactly. We switched from Nixpacks
# because Nixpacks auto-detects Next.js in the workspace and tries to
# install Node.js 18.x alongside Bun, which is EOL and rejected by the
# Nix package set as of 2026-05. The Dockerfile is reproducible and
# avoids that surface entirely.
#
# This is NOT a web service — no HTTP listener, no port, no healthcheck
# URL. Railway treats it as a long-running process and restarts on crash.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Worker should restart on crash but give up after repeated failures so we
# get paged via Railway's alerting instead of crashlooping silently.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# startCommand is provided by the Dockerfile's CMD line; no need to set
# it here unless we want to override.
